
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports AI Analyzer 0.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}
header{text-align:center;padding:20px}
h1{color:#54e0bd}
.card{background:#151e33;border:1px solid #293752;border-radius:14px;padding:16px;margin:14px 0}
select,button{width:100%;padding:13px;border-radius:9px;margin-top:10px;font-size:16px}
select{background:#263550;color:white}
button{background:#39d6b0;color:#07151a;font-weight:bold;border:0}
.small{font-size:12px;color:#aab5cc}
.match{padding:13px 0;border-bottom:1px solid #34415a}
.value{color:#54e0bd;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>SPORTS AI ANALYZER</h1>
<p>Versiunea 0.2 | Football Analytics</p>
</header>

<div class="card">
<h3>Alege competiția</h3>
<select id="league"><option>Se încarcă...</option></select>
<button onclick="loadLeague()">Încarcă meciurile</button>
<p id="status" class="small">Conectare la baza de date...</p>
</div>

<div class="card">
<h3>Meciuri disponibile</h3>
<div id="matches">Se încarcă...</div>
</div>

<div class="card">
<h3>Analiza meciului</h3>
<div id="analysis">Selectează un meci.</div>
</div>

<script>
const API="https://api.github.com/repos/oladeeayo/open-matchday/contents/data";
let competitions=[],results=[],fixtures=[];

function parseCSV(t){
 const lines=t.trim().split(/\r?\n/);
 if(lines.length<2)return [];
 const headers=lines[0].split(",").map(x=>x.replace(/"/g,"").trim());
 return lines.slice(1).map(line=>{
  const vals=line.split(",");
  let obj={};
  headers.forEach((h,i)=>obj[h]=(vals[i]||"").replace(/"/g,"").trim());
  return obj;
 });
}
function get(o,names){
 for(const n of names){
  const k=Object.keys(o).find(x=>x.toLowerCase()===n.toLowerCase());
  if(k&&o[k]!=="")return o[k];
 }
 return "";
}
function match(o){
 const home=get(o,["HomeTeam","Home","Home Team","home_team"]);
 const away=get(o,["AwayTeam","Away","Away Team","away_team"]);
 if(!home||!away)return null;
 return {
  home,away,
  date:get(o,["Date","MatchDate"]),
  hg:get(o,["FTHG","HomeGoals","HG"]),
  ag:get(o,["FTAG","AwayGoals","AG"])
 };
}
async function init(){
 try{
  let r=await fetch(API);
  if(!r.ok)throw Error();
  competitions=(await r.json()).filter(x=>x.type==="dir");
  let s=document.getElementById("league");
  s.innerHTML="";
  competitions.forEach((c,i)=>{
   let op=document.createElement("option");
   op.value=i;
   op.textContent=c.name.replaceAll("_"," ");
   s.appendChild(op);
  });
  document.getElementById("status").textContent=competitions.length+" competiții găsite.";
 }catch(e){
  document.getElementById("status").textContent="Conexiunea nu a reușit. Reîncarcă pagina.";
 }
}
async function loadLeague(){
 const c=competitions[document.getElementById("league").value];
 if(!c)return;
 document.getElementById("status").textContent="Se descarcă datele...";
 document.getElementById("matches").textContent="Se încarcă...";
 results=[];fixtures=[];
 try{
  const files=await fetch(API+"/"+c.name).then(r=>r.json());
  const rf=files.find(x=>/results.*2627.*csv/i.test(x.name));
  const ff=files.find(x=>/fixtures.*2627.*csv/i.test(x.name));
  if(rf){
   const t=await fetch(rf.download_url).then(r=>r.text());
   results=parseCSV(t).map(match).filter(x=>x&&x.hg!==""&&x.ag!=="");
  }
  if(ff){
   const t=await fetch(ff.download_url).then(r=>r.text());
   fixtures=parseCSV(t).map(match).filter(Boolean);
  }
  showMatches();
  document.getElementById("status").textContent=
   results.length+" rezultate și "+fixtures.length+" meciuri găsite.";
 }catch(e){
  document.getElementById("status").textContent="Nu s-au putut încărca datele.";
 }
}
function showMatches(){
 const el=document.getElementById("matches");
 el.innerHTML="";
 if(!fixtures.length){
  el.textContent="Nu există meciuri disponibile în fișier.";
  return;
 }
 fixtures.slice(0,40).forEach(m=>{
  const d=document.createElement("div");
  d.className="match";
  const title=document.createElement("b");
  title.textContent=m.home+" - "+m.away;
  const date=document.createElement("p");
  date.className="small";
  date.textContent=m.date||"Data indisponibilă";
  const b=document.createElement("button");
  b.textContent="Analizează";
  b.onclick=()=>analyze(m);
  d.append(title,date,b);
  el.appendChild(d);
 });
}
function stats(team){
 const games=results.filter(m=>m.home===team||m.away===team).slice(-10);
 let scored=0,conceded=0,n=0;
 games.forEach(m=>{
  let h=Number(m.hg),a=Number(m.ag);
  if(!Number.isFinite(h)||!Number.isFinite(a))return;
  if(m.home===team){scored+=h;conceded+=a;}
  else{scored+=a;conceded+=h;}
  n++;
 });
 return n?{attack:scored/n,defence:conceded/n,n}:
 {attack:1.3,defence:1.3,n:0};
}
function fact(n){
 let x=1;
 for(let i=2;i<=n;i++)x*=i;
 return x;
}
function poisson(l,k){
 return Math.exp(-l)*Math.pow(l,k)/fact(k);
}
function analyze(m){
 const h=stats(m.home),a=stats(m.away);
 const lh=(h.attack+a.defence)/2;
 const la=(a.attack+h.defence)/2;
 let one=0,x=0,two=0,over=0,gg=0;
 for(let i=0;i<=8;i++){
  for(let j=0;j<=8;j++){
   let p=poisson(lh,i)*poisson(la,j);
   if(i>j)one+=p;
   else if(i===j)x+=p;
   else two+=p;
   if(i+j>=3)over+=p;
   if(i>0&&j>0)gg+=p;
  }
 }
 const pct=n=>(n*100).toFixed(1)+"%";
 const odd=n=>(n>0?(1/n).toFixed(2):"-");
 document.getElementById("analysis").innerHTML=`
 <h3>${m.home} - ${m.away}</h3>
 <p class="small">Model statistic simplificat</p>
 Goluri estimate: <b class="value">${lh.toFixed(2)} - ${la.toFixed(2)}</b><br><br>
 <b>1X2</b><br>
 1: <span class="value">${pct(one)}</span> | Cotă teoretică ${odd(one)}<br>
 X: <span class="value">${pct(x)}</span> | Cotă teoretică ${odd(x)}<br>
 2: <span class="value">${pct(two)}</span> | Cotă teoretică ${odd(two)}<br><br>
 <b>Goluri</b><br>
 Peste 2.5: <span class="value">${pct(over)}</span><br>
 Sub 2.5: <span class="value">${pct(1-over)}</span><br><br>
 <b>GG / NG</b><br>
 GG: <span class="value">${pct(gg)}</span><br>
 NG: <span class="value">${pct(1-gg)}</span><br><br>
 <p class="small">Istoric folosit: ${h.n} meciuri gazde și ${a.n} meciuri oaspeți. Estimările pot fi imprecise, mai ales când lipsesc date.</p>`;
}
init();
</script>
</body>
</html>
